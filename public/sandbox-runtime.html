<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wonder sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime",
          "react-dom": "https://esm.sh/react-dom@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "lucide-react": "https://esm.sh/lucide-react@0.454.0?external=react",
          "@iconify/react": "https://esm.sh/@iconify/react@5.0.2?external=react",
          "motion": "https://esm.sh/motion@11.11.17?external=react"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        min-height: 100%;
        min-width: max-content;
        overflow: hidden;
      }
      #root {
        padding: 0;
        display: block;
        width: max-content;
        height: max-content;
      }
      #error {
        display: none;
        position: fixed;
        inset: 8px;
        padding: 12px;
        background: #1f1f24;
        color: #fca5a5;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        border: 1px solid #7f1d1d;
        border-radius: 8px;
        overflow: auto;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <pre id="error"></pre>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";

      const errorEl = document.getElementById("error");
      const showError = (msg) => {
        errorEl.textContent = msg;
        errorEl.style.display = "block";
      };
      const clearError = () => {
        errorEl.textContent = "";
        errorEl.style.display = "none";
      };

      window.addEventListener("error", (e) => {
        showError(String(e.error?.stack || e.message));
        parent.postMessage(
          { type: "sandbox:error", message: String(e.error?.stack || e.message) },
          "*",
        );
      });

      const root = createRoot(document.getElementById("root"));
      let currentUrl = null;
      let currentProps = {};

      function render(Component) {
        try {
          clearError();
          root.render(React.createElement(Component, currentProps));
          parent.postMessage({ type: "sandbox:rendered" }, "*");
          requestAnimationFrame(() => {
            emitSize();
            if (selectedPath) {
              emitRect(selectedPath);
              watchSelected(selectedPath);
            }
          });
        } catch (err) {
          showError(String(err?.stack || err));
          parent.postMessage(
            { type: "sandbox:error", message: String(err?.stack || err) },
            "*",
          );
        }
      }

      let CurrentComponent = null;
      let selectedPath = null;

      function hasOnlyTextChildren(el) {
        for (const child of el.childNodes) {
          if (child.nodeType === 1) return false;
        }
        return true;
      }

      function emitRect(path) {
        const el = path
          ? document.querySelector(`[data-wonder-path="${CSS.escape(path)}"]`)
          : null;
        parent.postMessage(
          {
            type: "sandbox:rect",
            path: path,
            rect: el ? el.getBoundingClientRect().toJSON() : null,
            tag: el ? el.tagName.toLowerCase() : "",
            className: el ? el.getAttribute("class") || "" : "",
          },
          "*",
        );
      }

      const rootEl = document.getElementById("root");

      const observer = new MutationObserver(() => {
        if (selectedPath) emitRect(selectedPath);
      });
      observer.observe(rootEl, {
        childList: true,
        subtree: true,
        attributes: true,
      });

      // Track the selected element's size so the selection overlay follows it
      // across reflows (font load, flex recompute, viewport changes, etc.).
      let selectedResizeObserver = null;
      function watchSelected(path) {
        if (selectedResizeObserver) {
          selectedResizeObserver.disconnect();
          selectedResizeObserver = null;
        }
        if (!path) return;
        const el = document.querySelector(`[data-wonder-path="${CSS.escape(path)}"]`);
        if (!el) return;
        selectedResizeObserver = new ResizeObserver(() => emitRect(path));
        selectedResizeObserver.observe(el);
      }

      function emitSize() {
        const r = rootEl.getBoundingClientRect();
        parent.postMessage(
          {
            type: "sandbox:size",
            width: Math.ceil(r.width) + 1,
            height: Math.ceil(r.height) + 1,
          },
          "*",
        );
      }
      const sizeObserver = new ResizeObserver(() => emitSize());
      sizeObserver.observe(rootEl);

      window.addEventListener("message", async (e) => {
        const msg = e.data;
        if (!msg || typeof msg !== "object") return;

        if (msg.type === "sandbox:render") {
          try {
            if (currentUrl) URL.revokeObjectURL(currentUrl);
            const blob = new Blob([msg.code], { type: "text/javascript" });
            currentUrl = URL.createObjectURL(blob);
            const mod = await import(/* @vite-ignore */ currentUrl);
            CurrentComponent = mod.default || mod.Component;
            if (!CurrentComponent) {
              throw new Error(
                "Module must have a default export (React component)",
              );
            }
            currentProps = msg.props || {};
            render(CurrentComponent);
          } catch (err) {
            showError(String(err?.stack || err));
            parent.postMessage(
              { type: "sandbox:error", message: String(err?.stack || err) },
              "*",
            );
          }
        } else if (msg.type === "sandbox:setProps") {
          currentProps = msg.props || {};
          if (CurrentComponent) render(CurrentComponent);
        } else if (msg.type === "sandbox:setSelection") {
          selectedPath = msg.path;
          requestAnimationFrame(() => {
            emitRect(selectedPath);
            watchSelected(selectedPath);
          });
        } else if (msg.type === "sandbox:setViewport") {
          if (msg.width != null) {
            document.body.style.width = msg.width + "px";
            document.getElementById("root").style.display = "block";
            document.getElementById("root").style.width = "100%";
          } else {
            document.body.style.width = "";
            document.getElementById("root").style.display = "inline-block";
            document.getElementById("root").style.width = "";
          }
        } else if (msg.type === "sandbox:setTokensCss") {
          // Replace (or create) the <style id="wonder-tokens"> tag. We re-set
          // .textContent rather than recreate the node to avoid a paint flash
          // while the user edits a token — same node, same cascade slot,
          // browsers just swap the rules in place.
          let style = document.getElementById("wonder-tokens");
          if (!style) {
            style = document.createElement("style");
            style.id = "wonder-tokens";
            // Append to head AFTER Tailwind's own injected rules so ours win
            // on equal-specificity (same .bg-primary) without !important.
            document.head.appendChild(style);
          }
          style.textContent = msg.css || "";
        } else if (msg.type === "sandbox:setInteractive") {
          // "Play" mode: stop capturing clicks / dblclicks so the component's
          // own onClick handlers run and CSS :hover/:focus/:active behave for
          // real. We keep listening — just gate the editor-specific work.
          INTERACTIVE = !!msg.interactive;
          // Leave any mid-edit text state cleanly when entering play mode.
          if (INTERACTIVE && editingEl) cancelEdit();
        }
      });

      // Defaults to editor mode. The parent flips this via `sandbox:setInteractive`.
      let INTERACTIVE = false;

      document.addEventListener(
        "click",
        (e) => {
          if (INTERACTIVE) return; // let the component's own handlers fire
          const target = e.target;
          if (!(target instanceof Element)) return;
          const el = target.closest("[data-wonder-path]");
          if (!el) return;
          e.preventDefault();
          e.stopPropagation();
          const path = el.getAttribute("data-wonder-path");
          selectedPath = path;
          watchSelected(path);
          parent.postMessage(
            {
              type: "sandbox:select",
              path,
              rect: el.getBoundingClientRect().toJSON(),
              tag: el.tagName.toLowerCase(),
              className: el.getAttribute("class") || "",
            },
            "*",
          );
        },
        true,
      );

      let editingEl = null;
      let editingOriginalText = "";

      function commitEdit() {
        if (!editingEl) return;
        const el = editingEl;
        editingEl = null;
        el.contentEditable = "false";
        el.style.outline = "";
        el.style.cursor = "";
        const newText = el.textContent || "";
        if (newText !== editingOriginalText) {
          parent.postMessage(
            {
              type: "sandbox:textCommit",
              path: el.getAttribute("data-wonder-path"),
              text: newText,
            },
            "*",
          );
        }
      }

      function cancelEdit() {
        if (!editingEl) return;
        const el = editingEl;
        editingEl = null;
        el.contentEditable = "false";
        el.style.outline = "";
        el.style.cursor = "";
        el.textContent = editingOriginalText;
      }

      document.addEventListener(
        "dblclick",
        (e) => {
          if (INTERACTIVE) return; // play mode: no text-edit affordance
          const target = e.target;
          if (!(target instanceof Element)) return;
          const el = target.closest("[data-wonder-path]");
          if (!el || !(el instanceof HTMLElement)) return;
          if (!hasOnlyTextChildren(el)) return;
          e.preventDefault();
          e.stopPropagation();
          if (editingEl) commitEdit();
          editingEl = el;
          editingOriginalText = el.textContent || "";
          el.contentEditable = "true";
          el.style.outline = "2px solid #10b981";
          el.style.outlineOffset = "2px";
          el.style.borderRadius = "3px";
          el.style.cursor = "text";
          el.focus();
          // Select all text
          const range = document.createRange();
          range.selectNodeContents(el);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          parent.postMessage(
            {
              type: "sandbox:textEdit",
              path: el.getAttribute("data-wonder-path"),
              rect: el.getBoundingClientRect().toJSON(),
              text: editingOriginalText,
            },
            "*",
          );
        },
        true,
      );

      document.addEventListener("keydown", (e) => {
        if (editingEl) {
          if (e.key === "Escape") { e.preventDefault(); cancelEdit(); }
          if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); commitEdit(); }
          return;
        }
        if (INTERACTIVE) return; // play mode: don't steal Backspace from inputs
        if (e.key === "Backspace" || e.key === "Delete") {
          e.preventDefault();
          parent.postMessage({ type: "sandbox:deleteKey" }, "*");
        }
      }, true);

      document.addEventListener("click", (e) => {
        if (!editingEl) return;
        if (e.target instanceof Element && editingEl.contains(e.target)) return;
        commitEdit();
      }, true);

      document.addEventListener("mouseover", (e) => {
        if (INTERACTIVE) return; // play mode: no hover-rect telemetry
        const target = e.target;
        if (!(target instanceof Element)) return;
        const el = target.closest("[data-wonder-path]");
        if (!el) return;
        parent.postMessage(
          {
            type: "sandbox:hover",
            path: el.getAttribute("data-wonder-path"),
            rect: el.getBoundingClientRect().toJSON(),
          },
          "*",
        );
      });

      const DRAG_MIME = "application/x-wonder-primitive";
      const LINE_THICKNESS = 3;

      // Size of the primitive being dragged — set via "wonder:dragStart" from
      // the parent window when the user starts dragging from the sidebar.
      // Used to render a ghost preview matching what will actually be inserted.
      let pendingDragSize = null;

      window.addEventListener("message", (e) => {
        const d = e.data;
        if (!d || typeof d !== "object") return;
        if (d.type === "wonder:dragStart") {
          pendingDragSize = d.size || null;
        } else if (d.type === "wonder:dragEnd") {
          pendingDragSize = null;
        }
      });

      function hasWonderElementChildren(el) {
        for (let i = 0; i < el.children.length; i++) {
          if (el.children[i].hasAttribute("data-wonder-path")) return true;
        }
        return false;
      }

      /**
       * Walk up from the hovered element to find the right DROP CONTAINER.
       * Rules:
       *   - If hovered has element-children with data-wonder-path → it's a container, use it.
       *   - If hovered is a leaf (span/button/img/etc. or any element without such children),
       *     climb to the nearest ancestor that DOES have such children.
       *   - Fall back to the root if nothing else matches.
       *
       * This makes "drag primitive over the title text of a card" resolve the
       * card as the container, not the text leaf.
       */
      function findDropContainer(target) {
        if (!(target instanceof Element)) return null;
        let el = target.closest("[data-wonder-path]");
        while (el && !hasWonderElementChildren(el)) {
          // Climb to the nearest wonder-path ancestor that has wonder-path children.
          const parent = el.parentElement
            ? el.parentElement.closest("[data-wonder-path]")
            : null;
          if (!parent) break;
          el = parent;
        }
        return el;
      }

      function primaryAxisIsRow(container, kids) {
        const cs = window.getComputedStyle(container);
        if (cs.display.includes("flex")) return cs.flexDirection.startsWith("row");
        if (cs.display === "grid") {
          if (cs.gridAutoFlow.includes("column")) return true;
          const cols = cs.gridTemplateColumns
            .split(" ")
            .filter(Boolean).length;
          if (cols > 1 && kids.length > 1) return true;
          return false;
        }
        // Block-ish → vertical stacking by default.
        return false;
      }

      function rectToPlain(r) {
        return {
          x: r.x,
          y: r.y,
          left: r.left,
          top: r.top,
          right: r.right,
          bottom: r.bottom,
          width: r.width,
          height: r.height,
        };
      }

      /**
       * Given a drop container and pointer position, decide:
       *  - insertion index among element-children
       *  - marker rect (insertion LINE between siblings)
       *  - ghost rect (approx rect where the dropped primitive will end up)
       *  - mode: "inside" (empty container) | "before" | "after"
       */
      function computeDropHint(container, clientX, clientY) {
        const kids = Array.from(container.children).filter(
          (n) => n instanceof Element && n.hasAttribute("data-wonder-path"),
        );
        const containerRect = container.getBoundingClientRect();
        const cs = window.getComputedStyle(container);
        const isRow = primaryAxisIsRow(container, kids);
        const size = pendingDragSize || { w: 120, h: 40 };

        if (kids.length === 0) {
          const padT = parseFloat(cs.paddingTop) || 0;
          const padL = parseFloat(cs.paddingLeft) || 0;
          const padR = parseFloat(cs.paddingRight) || 0;
          const padB = parseFloat(cs.paddingBottom) || 0;
          const innerW = Math.max(0, containerRect.width - padL - padR);
          const innerH = Math.max(0, containerRect.height - padT - padB);
          const markerRect = rectToPlain({
            x: containerRect.left + padL,
            y: containerRect.top + padT,
            left: containerRect.left + padL,
            top: containerRect.top + padT,
            right: containerRect.left + padL + innerW,
            bottom: containerRect.top + padT + LINE_THICKNESS,
            width: innerW,
            height: LINE_THICKNESS,
          });
          // Ghost in the top-left of the container's inner box, clipped to available space.
          const gw = Math.min(size.w, innerW);
          const gh = Math.min(size.h, innerH);
          const ghostRect = rectToPlain({
            x: containerRect.left + padL,
            y: containerRect.top + padT,
            left: containerRect.left + padL,
            top: containerRect.top + padT,
            right: containerRect.left + padL + gw,
            bottom: containerRect.top + padT + gh,
            width: gw,
            height: gh,
          });
          return { mode: "inside", index: 0, markerRect, ghostRect };
        }

        // Find nearest sibling on the primary axis.
        let bestIdx = 0;
        let bestDist = Infinity;
        let bestSide = "before";
        for (let i = 0; i < kids.length; i++) {
          const r = kids[i].getBoundingClientRect();
          const midPrimary = isRow ? (r.left + r.right) / 2 : (r.top + r.bottom) / 2;
          const p = isRow ? clientX : clientY;
          const d = Math.abs(p - midPrimary);
          if (d < bestDist) {
            bestDist = d;
            bestIdx = i;
            bestSide = p < midPrimary ? "before" : "after";
          }
        }
        const nearRect = kids[bestIdx].getBoundingClientRect();
        const insertIndex = bestSide === "before" ? bestIdx : bestIdx + 1;

        // Marker LINE — thin, along the cross axis at the exact insertion edge.
        let markerRect;
        let ghostRect;
        if (isRow) {
          const xEdge = bestSide === "before" ? nearRect.left : nearRect.right;
          const top = Math.max(containerRect.top, nearRect.top - 4);
          const bottom = Math.min(containerRect.bottom, nearRect.bottom + 4);
          markerRect = rectToPlain({
            x: xEdge - LINE_THICKNESS / 2,
            y: top,
            left: xEdge - LINE_THICKNESS / 2,
            top,
            right: xEdge + LINE_THICKNESS / 2,
            bottom,
            width: LINE_THICKNESS,
            height: bottom - top,
          });
          // Ghost: width = primitive width capped to container, height = sibling height.
          const gw = Math.min(size.w, containerRect.width);
          const gh = Math.max(nearRect.height, Math.min(size.h, containerRect.height));
          const gy = nearRect.top + (nearRect.height - gh) / 2;
          const gx = bestSide === "before" ? xEdge - gw / 2 : xEdge - gw / 2;
          ghostRect = rectToPlain({
            x: gx,
            y: gy,
            left: gx,
            top: gy,
            right: gx + gw,
            bottom: gy + gh,
            width: gw,
            height: gh,
          });
        } else {
          const yEdge = bestSide === "before" ? nearRect.top : nearRect.bottom;
          const left = Math.max(containerRect.left, nearRect.left - 4);
          const right = Math.min(containerRect.right, nearRect.right + 4);
          markerRect = rectToPlain({
            x: left,
            y: yEdge - LINE_THICKNESS / 2,
            left,
            top: yEdge - LINE_THICKNESS / 2,
            right,
            bottom: yEdge + LINE_THICKNESS / 2,
            width: right - left,
            height: LINE_THICKNESS,
          });
          // Ghost: width = sibling width, height = primitive height.
          const gw = Math.max(nearRect.width, Math.min(size.w, containerRect.width));
          const gh = Math.min(size.h, containerRect.height);
          const gx = nearRect.left + (nearRect.width - gw) / 2;
          const gy = yEdge - gh / 2;
          ghostRect = rectToPlain({
            x: gx,
            y: gy,
            left: gx,
            top: gy,
            right: gx + gw,
            bottom: gy + gh,
            width: gw,
            height: gh,
          });
        }

        return { mode: bestSide, index: insertIndex, markerRect, ghostRect };
      }

      // Stash the last hint so drop can reuse the container path + index the
      // user visually saw (instead of inferring from the drop event target).
      let lastDropHint = null;

      document.addEventListener("dragover", (e) => {
        if (INTERACTIVE) return; // play mode: no authoring drops
        // Only react to Wonder primitive drags.
        const types = e.dataTransfer ? Array.from(e.dataTransfer.types) : [];
        if (!types.includes(DRAG_MIME)) return;
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = "copy";
        const container = findDropContainer(e.target)
          || document.querySelector("[data-wonder-path]");
        const path = container ? container.getAttribute("data-wonder-path") : "0";
        const rect = container ? rectToPlain(container.getBoundingClientRect()) : null;

        const hint = container ? computeDropHint(container, e.clientX, e.clientY) : null;
        lastDropHint = hint ? { path, ...hint } : null;

        parent.postMessage(
          {
            type: "sandbox:dragOver",
            path,
            rect,
            index: hint ? hint.index : undefined,
            markerRect: hint ? hint.markerRect : null,
            ghostRect: hint ? hint.ghostRect : null,
            mode: hint ? hint.mode : undefined,
          },
          "*",
        );
      });

      document.addEventListener("dragleave", (e) => {
        if (e.relatedTarget) return;
        lastDropHint = null;
        parent.postMessage({ type: "sandbox:dragLeave" }, "*");
      });

      document.addEventListener("drop", (e) => {
        if (INTERACTIVE) return;
        const snippet = e.dataTransfer ? e.dataTransfer.getData(DRAG_MIME) : "";
        if (!snippet) return;
        e.preventDefault();
        let parsed = null;
        try { parsed = JSON.parse(snippet); } catch {}
        // Use the container + index computed during the last dragover so the
        // drop lands exactly where the user saw the insertion line.
        const path = lastDropHint
          ? lastDropHint.path
          : (findDropContainer(e.target)?.getAttribute("data-wonder-path") ?? "0");
        const index = lastDropHint ? lastDropHint.index : undefined;
        lastDropHint = null;
        pendingDragSize = null;
        parent.postMessage(
          {
            type: "sandbox:drop",
            path,
            snippet: parsed?.snippet ?? snippet,
            name: parsed?.componentName,
            index,
          },
          "*",
        );
      });

      parent.postMessage({ type: "sandbox:ready" }, "*");
    </script>
  </body>
</html>
